<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono','SF Mono',Menlo,Consolas,monospace; }
      .sans { font-family: Inter,-apple-system,'Segoe UI',Roboto,sans-serif; }
    </style>
    <linearGradient id="grid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#0d0d10"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Faint dot grid -->
  <g fill="#1c1c1f">
    <g>
      <circle cx="60" cy="70" r="1.4"/><circle cx="180" cy="70" r="1.4"/><circle cx="300" cy="70" r="1.4"/>
      <circle cx="420" cy="70" r="1.4"/><circle cx="540" cy="70" r="1.4"/><circle cx="660" cy="70" r="1.4"/>
      <circle cx="780" cy="70" r="1.4"/><circle cx="900" cy="70" r="1.4"/><circle cx="1020" cy="70" r="1.4"/><circle cx="1140" cy="70" r="1.4"/>
    </g>
    <g>
      <circle cx="60" cy="560" r="1.4"/><circle cx="180" cy="560" r="1.4"/><circle cx="300" cy="560" r="1.4"/>
      <circle cx="420" cy="560" r="1.4"/><circle cx="540" cy="560" r="1.4"/><circle cx="660" cy="560" r="1.4"/>
      <circle cx="780" cy="560" r="1.4"/><circle cx="900" cy="560" r="1.4"/><circle cx="1020" cy="560" r="1.4"/><circle cx="1140" cy="560" r="1.4"/>
    </g>
  </g>

  <!-- Terminal window -->
  <rect x="90" y="120" width="720" height="390" rx="14" fill="#101013" stroke="#26262a" stroke-width="1.5"/>
  <rect x="90" y="120" width="720" height="52" rx="14" fill="#151519"/>
  <rect x="90" y="158" width="720" height="14" fill="#151519"/>
  <line x1="90" y1="172" x2="810" y2="172" stroke="#26262a" stroke-width="1.5"/>
  <!-- traffic lights -->
  <circle cx="126" cy="146" r="7" fill="#ff5f56"/>
  <circle cx="152" cy="146" r="7" fill="#ffbd2e"/>
  <circle cx="178" cy="146" r="7" fill="#27c93f"/>
  <text x="450" y="152" class="mono" font-size="15" fill="#525258" text-anchor="middle">logan@cluster: ~</text>

  <!-- prompt line -->
  <text x="130" y="228" class="mono" font-size="24" fill="#34d399">$</text>
  <text x="156" y="228" class="mono" font-size="24" fill="#e4e4e7">whoami</text>
  <text x="130" y="276" class="mono" font-size="30" fill="#fafafa">logan</text>

  <!-- divider -->
  <line x1="130" y1="316" x2="770" y2="316" stroke="#232327" stroke-width="1.5"/>

  <!-- name + role -->
  <text x="130" y="382" class="sans" font-size="42" font-weight="600" fill="#fafafa" letter-spacing="-0.5">Logan Matthew Phillips</text>
  <text x="130" y="428" class="sans" font-size="23" fill="#a1a1aa">Systems Integration Engineer</text>
  <text x="130" y="462" class="sans" font-size="23" fill="#71717a">Autonomous vehicle infrastructure · Oakland, CA</text>

  <!-- GPU cluster motif (right) -->
  <g stroke-linecap="round">
    <!-- bus lines to hub -->
    <g stroke="#2f3b38" stroke-width="2">
      <line x1="905" y1="250" x2="980" y2="315"/>
      <line x1="905" y1="380" x2="980" y2="315"/>
      <line x1="1085" y1="250" x2="1010" y2="315"/>
      <line x1="1085" y1="380" x2="1010" y2="315"/>
    </g>
    <!-- data pulses -->
    <circle cx="942" cy="282" r="4" fill="#34d399"/>
    <circle cx="1048" cy="350" r="4" fill="#34d399"/>
    <!-- 2x2 GPU cards -->
    <g fill="#0e1512" stroke="#2b3a34" stroke-width="2">
      <rect x="852" y="208" width="96" height="86" rx="8"/>
      <rect x="852" y="336" width="96" height="86" rx="8"/>
      <rect x="1036" y="208" width="96" height="86" rx="8"/>
      <rect x="1036" y="336" width="96" height="86" rx="8"/>
    </g>
    <!-- fan rings -->
    <g fill="none" stroke="#3f5a50" stroke-width="2">
      <circle cx="900" cy="251" r="24"/><circle cx="900" cy="379" r="24"/>
      <circle cx="1084" cy="251" r="24"/><circle cx="1084" cy="379" r="24"/>
    </g>
    <!-- accent glows on two cards -->
    <rect x="852" y="208" width="96" height="86" rx="8" fill="none" stroke="#34d399" stroke-width="2"/>
    <rect x="1036" y="336" width="96" height="86" rx="8" fill="none" stroke="#34d399" stroke-width="2"/>
    <!-- hub -->
    <circle cx="995" cy="315" r="16" fill="#101013" stroke="#34d399" stroke-width="2.5"/>
    <circle cx="995" cy="315" r="5" fill="#34d399"/>
  </g>

  <!-- domain footer -->
  <text x="90" y="560" class="mono" font-size="16" fill="#525258">l064n.github.io</text>
  <circle cx="60" cy="554" r="4" fill="#34d399"/>
</svg>
