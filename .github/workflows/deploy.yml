name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Status telemetry pushes must not trigger full site rebuilds.
    paths-ignore:
      - 'public/status.json'
      - 'status/**'
      - 'legacy-2020/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # GitHub Pages only serves extensionless URLs from directory index files.
      # Convert out/foo.html -> out/foo/index.html so /foo resolves.
      - name: Generate directory index files
        run: |
          find out -name '*.html' -not -name 'index.html' -not -name '404.html' | while read -r f; do
            dir=$(dirname "$f")
            base=$(basename "$f" .html)
            mkdir -p "$dir/$base"
            cp "$f" "$dir/$base/index.html"
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
